monitoring:
  watch_directory: data/sandbox
  analysis_window_seconds: 60
detection:
  max_modified_files: 10
  max_renamed_files: 5
  max_extension_changes: 3
  high_entropy_threshold: 7.0
  suspicious_entropy_threshold: 4.5
threat_scoring:
  rapid_encryption: 40
  mass_rename: 30
  high_entropy: 25
  cpu_spike: 15
  unknown_process: 10
process_monitoring:
  cpu_spike_threshold: 80.0
  trusted_processes:
  - python.exe
  - code.exe
  - explorer.exe
  - svchost.exe
  - System
  - Registry
  - MsMpEng.exe
  - powershell.exe
  - pwsh.exe
